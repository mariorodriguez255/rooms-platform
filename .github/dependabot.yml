version: 2
updates:
  - package-ecosystem: npm # also handles pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    # Same idea as pnpm's minimumReleaseAge: let new releases mature first.
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types must match the Node.js runtime (24, see .nvmrc and
      # package.json engines): newer types allow APIs that Node 24 lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript and ESLint stay on the majors of ADR 0002 until the Next.js
      # template and its ESLint plugins move on.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
