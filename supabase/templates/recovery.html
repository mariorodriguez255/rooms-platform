<h2>Restablece tu contraseña</h2>
<p>Hola:</p>
<p>
  Hemos recibido una solicitud para cambiar la contraseña de tu cuenta. Elige
  una nueva aquí:
</p>
<p>
  <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery"
    >Elegir una contraseña nueva</a
  >
</p>
<p>
  El enlace caduca en una hora. Si no lo has pedido tú, ignora este mensaje: tu
  contraseña no cambia.
</p>
